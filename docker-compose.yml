# VisionForge local infrastructure.
#
# Stateful services only. The API, workers and web app run natively on the host
# (Phase 0, ADR-0002) because this machine has 7.4 GB of RAM and containerising
# the application processes as well would not fit alongside an IDE and a browser.
#
#   docker compose up -d        # start postgres, redis, minio
#   docker compose down         # stop, keep data
#   docker compose down -v      # stop and delete data
#
# Host ports are deliberately non-default: 5432/5433/6379 are already occupied on
# this machine by unrelated projects. See ADR-0001.

name: visionforge

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: visionforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visionforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionforge}
      POSTGRES_DB: ${POSTGRES_DB:-visionforge}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      # Tuned small on purpose: this host has 7.4 GB of RAM total.
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visionforge} -d ${POSTGRES_DB:-visionforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: visionforge-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "${REDIS_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: visionforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visionforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-visionforge-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M

  # One-shot: creates the three buckets, then exits. Not a long-running service.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: visionforge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visionforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-visionforge-dev-secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/visionforge-media &&
      mc mb --ignore-existing local/visionforge-derivatives &&
      mc mb --ignore-existing local/visionforge-renders &&
      echo 'buckets ready'
      "
    restart: "no"

volumes:
  postgres-data:
  minio-data:
